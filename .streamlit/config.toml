# TruePath AI - Streamlit theme.
# A calm, professional dark palette that lets the verdict color do
# the talking. Accent ramp: teal (Aligned) -> amber (Partial) -> red (Significant).

[theme]
base                  = "dark"
primaryColor          = "#2dd4bf"   # teal accent (Aligned / on-track)
backgroundColor       = "#0b1220"   # deep navy app background
secondaryBackgroundColor = "#111a2e" # cards / sidebar
textColor             = "#e6edf7"   # near-white body text
font                  = "sans serif"

[server]
runOnSave             = true
headless              = false

[browser]
gatherUsageStats      = false
